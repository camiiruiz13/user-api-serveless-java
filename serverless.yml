service: user-api-serverless-java
frameworkVersion: '3'

provider:
  name: aws
  runtime: java17
  region: us-east-1
  stage: dev
  memorySize: 512
  timeout: 10
  environment:
    DYNAMODB_TABLE_NAME: users
    USER_NOTIFICATION_TOPIC_ARN:
      Ref: EmailNotificationTopic

  iam:
    role:
      managedPolicies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      statements:
        - Effect: Allow
          Action:
            - dynamodb:DescribeTable
            - dynamodb:CreateTable
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/users
        - Effect: Allow
          Action: sns:Publish
          Resource:
            - Ref: EmailNotificationTopic

package:
  artifact: target/user-api-serverless-java-1.0-SNAPSHOT.jar

# Toggle legible por Serverless (default: no crear la tabla)
custom:
  createUsersTable: ${param:createUsersTable, 'false'}

functions:
  getAllUsers:
    handler: com.aws.ccamilo.com.app.useapiserveless.handler.GetAllUsersHandler::handleRequest
    events:
      - httpApi:
          path: /users
          method: get

  getUserById:
    handler: com.aws.ccamilo.com.app.useapiserveless.handler.GetUserByIdHandler::handleRequest
    events:
      - httpApi:
          path: "/users/{id}"
          method: get

  createUser:
    handler: com.aws.ccamilo.com.app.useapiserveless.handler.CreateUserHandler::handleRequest
    events:
      - httpApi:
          path: /users
          method: post

  updateUser:
    handler: com.aws.ccamilo.com.app.useapiserveless.handler.UpdateUserHandler::handleRequest
    events:
      - httpApi:
          path: /users
          method: put

  deleteUser:
    handler: com.aws.ccamilo.com.app.useapiserveless.handler.DeleteUserHandler::handleRequest
    events:
      - httpApi:
          path: "/users/{id}"
          method: delete

resources:
  # CloudFormation exige operaciones booleanas en Conditions
  Conditions:
    CreateUsersTable:
      Fn::Equals:
        - ${self:custom.createUsersTable}
        - 'true'

  Resources:
    EmailNotificationTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${self:provider.stage}-email-notification-topic

    # Solo se crea si CreateUsersTable == true
    UsersDynamoDBTable:
      Condition: CreateUsersTable
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: users
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
